<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>GIA PHẢ — DÒNG HỌ PHẠM ĐỨC (范德)</title>
<style>
  :root {
    --nen: #faf7f2;
    --giay: #fffdf9;
    --muc: #241f1a;
    --muc-nhat: #6b6156;
    --vien: #e6ddcf;
    --do: #8b1a1a;
    --do-nhat: #a4161a;
    --vang: #a97b12;
    --loi: #9b1c1c;
    --loin: #fdeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--nen);
    color: var(--muc);
    font-family: "Noto Serif", "Times New Roman", Georgia, serif;
    padding: 20px;
  }
  .box {
    background: var(--giay);
    border: 2px double var(--do);
    border-radius: 12px;
    padding: 38px 32px 36px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(80, 50, 20, 0.08);
  }
  .han {
    font-size: 15px;
    letter-spacing: 0.5em;
    color: var(--vang);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    color: var(--do);
    margin: 4px 0 2px;
    letter-spacing: 0.1em;
  }
  .sub {
    font-size: 14px;
    color: var(--muc-nhat);
    letter-spacing: 0.15em;
    margin-bottom: 22px;
  }
  .mo-ta {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muc);
    margin-bottom: 22px;
  }
  .form-group {
    position: relative;
    margin-bottom: 16px;
  }
  input[type="password"] {
    width: 100%;
    padding: 13px 16px;
    font-size: 16px;
    border: 1px solid var(--vien);
    border-radius: 8px;
    background: #fff;
    color: var(--muc);
    outline: none;
    text-align: center;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="password"]:focus {
    border-color: var(--do);
    box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.12);
  }
  button {
    width: 100%;
    padding: 13px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--do);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  button:hover {
    background: var(--do-nhat);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .loi-nhan {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--loin);
    color: var(--loi);
    font-size: 14px;
    border: 1px solid #f0c3c0;
  }
  .loading {
    display: none;
    margin-top: 14px;
    font-size: 14px;
    color: var(--vang);
  }
  .chan {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muc-nhat);
    border-top: 1px solid var(--vien);
    padding-top: 14px;
  }
</style>
</head>
<body>

<div class="box" id="lockCard">
  <div class="han">范 德 家 譜</div>
  <h1>GIA PHẢ</h1>
  <div class="sub">DÒNG HỌ PHẠM ĐỨC (范德)</div>
  <p class="mo-ta">Tài liệu lưu hành nội bộ gia tộc.<br>Vui lòng nhập mật mã để mở:</p>

  <form id="unlockForm" onsubmit="handleUnlock(event)">
    <div class="form-group">
      <input type="password" id="pwdInput" placeholder="Nhập mật khẩu..." autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" id="btnSubmit">Mở gia phả</button>
    <div id="errorMsg" class="loi-nhan">Mật khẩu không đúng. Vui lòng thử lại.</div>
    <div id="loadingMsg" class="loading">Đang giải mã...</div>
  </form>

  <div class="chan">❖ Dành riêng cho con cháu &amp; thân hữu ❖</div>
</div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    bytes[i] = bin.charCodeAt(i);
  }
  return bytes;
}

async function decryptHtml(pass) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.s);
  const iv = b64ToBytes(PAYLOAD.i);
  const data = b64ToBytes(PAYLOAD.c);

  const baseKey = await crypto.subtle.importKey(
    "raw",
    enc.encode(pass),
    { name: "PBKDF2" },
    false,
    ["deriveKey"]
  );

  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 100000,
      hash: "SHA-256"
    },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: iv },
    key,
    data
  );

  return new TextDecoder().decode(decrypted);
}

function renderDecrypted(html, pass) {
  try {
    sessionStorage.setItem("pd_unlocked_pw", pass);
  } catch(e) {}
  document.open();
  document.write(html);
  document.close();
}

async function tryPassword(pass) {
  if (!pass) return false;
  const err = document.getElementById("errorMsg");
  const loading = document.getElementById("loadingMsg");
  const btn = document.getElementById("btnSubmit");
  if (err) err.style.display = "none";
  if (loading) loading.style.display = "block";
  if (btn) btn.disabled = true;

  try {
    const html = await decryptHtml(pass.trim());
    renderDecrypted(html, pass.trim());
    return true;
  } catch (e) {
    if (err) err.style.display = "block";
    if (loading) loading.style.display = "none";
    if (btn) btn.disabled = false;
    return false;
  }
}

async function handleUnlock(e) {
  if (e) e.preventDefault();
  const pwd = document.getElementById("pwdInput").value;
  await tryPassword(pwd);
}

// Tự động giải mã nếu có trong URL hash (#phamduc hoặc #key=phamduc) hoặc sessionStorage
window.addEventListener("DOMContentLoaded", async () => {
  let autoPass = "";
  if (window.location.hash) {
    const hash = decodeURIComponent(window.location.hash.substring(1));
    if (hash.startsWith("key=")) {
      autoPass = hash.substring(4);
    } else {
      autoPass = hash;
    }
  }
  if (!autoPass) {
    try {
      autoPass = sessionStorage.getItem("pd_unlocked_pw") || "";
    } catch(e) {}
  }

  if (autoPass) {
    const ok = await tryPassword(autoPass);
    if (!ok) {
      const pwdInput = document.getElementById("pwdInput");
      if (pwdInput) pwdInput.value = autoPass;
    }
  }
});
</script>
